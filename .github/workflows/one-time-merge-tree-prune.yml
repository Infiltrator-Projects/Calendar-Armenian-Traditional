name: Verify and prune already incorporated feature branch
on:
  push:
    paths:
      - '.github/workflows/one-time-merge-tree-prune.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  safe-prune:
    runs-on: ubuntu-latest
    steps:
      - name: Compare actual merge tree before safe branch removal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: feature/two-file-illustrated-calendar
        run: |
          set -euo pipefail
          branch_json=$(gh api "repos/$GH_REPO/branches/$SOURCE_BRANCH") || { echo 'Branch absent'; exit 0; }
          [[ "$(jq -r '.protected' <<<"$branch_json")" == 'false' ]] || { echo 'Protected branch retained'; exit 0; }
          branch_sha=$(jq -r '.commit.sha' <<<"$branch_json")
          open_pr_heads=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].head.ref') || { echo 'PR lookup failed: retaining'; exit 0; }
          if grep -Fxq -- "$SOURCE_BRANCH" <<<"$open_pr_heads"; then echo 'Open PR: retaining'; exit 0; fi
          mkdir -p /tmp/verify-merge-tree
          cd /tmp/verify-merge-tree
          git init -q
          gh auth setup-git --hostname github.com
          git remote add origin "https://github.com/$GH_REPO.git"
          git fetch -q --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          checked_main=$(git rev-parse refs/remotes/origin/main)
          checked_branch=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")
          [[ "$branch_sha" == "$checked_branch" ]] || { echo 'Branch moved: retaining'; exit 0; }
          if ! merged_tree=$(git merge-tree --write-tree "$checked_main" "$checked_branch" 2>&1); then
            echo 'Not cleanly merged: retaining'; exit 0
          fi
          main_tree=$(git rev-parse "$checked_main^{tree}")
          [[ "$merged_tree" == "$main_tree" ]] || { echo 'Unique source remains: retaining'; exit 0; }
          [[ "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" == "$checked_main" ]] || { echo 'Concurrent main update: retaining'; exit 0; }
          [[ "$(gh api "repos/$GH_REPO/branches/$SOURCE_BRANCH" --jq '.commit.sha')" == "$checked_branch" ]] || { echo 'Concurrent branch update: retaining'; exit 0; }
          echo 'Branch adds no content to main: deleting using atomic commit lease'
          git push --porcelain --force-with-lease="refs/heads/$SOURCE_BRANCH:$checked_branch" origin ":refs/heads/$SOURCE_BRANCH"
